<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .nav-active {color: black !important;}
                @keyframes shine {
            0% {
                left: -150%;
            }
            100% {
                left: 200%;
            }
        }
        .loader-dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loader-dots span {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: #DF414F;
            animation: loaderBounce 1s infinite ease-in-out;
        }
        .loader-dots span:nth-child(2) {
            animation-delay: .15s;
        }
        .loader-dots span:nth-child(3) {
            animation-delay: .3s;
        }
        @keyframes loaderBounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: .5;
            }
            40% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
        #page-slider{
            display:flex;
            transition:transform .35s ease;
        }
        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #6b7280;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .filter-chip.active {
            background: #DF414F;
            border-color: #DF414F;
            color: #fff;
            font-weight: 500;
        }
        .rv-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
            transition: background .15s ease;
        }
        .rv-bar-row:hover {
            background: #f9fafb;
        }
        .rv-bar-row.active {
            background: #fff1ee;
            border-color: #f5c6c3;
        }
        .rv-bar-label {
            width: 34px;
            font-size: 12px;
            color: #4b5563;
            text-align: left;
            flex-shrink: 0;
        }
        .rv-bar-track {
            flex: 1;
            height: 6px;
            background: #f3f4f6;
            overflow: hidden;
        }
        .rv-bar-fill {
            display: block;
            height: 100%;
            background: #f59e0b;
            transition: width .3s ease;
        }
        .rv-bar-count {
            width: 24px;
            text-align: right;
            font-size: 12px;
            color: #9ca3af;
            flex-shrink: 0;
        }
        .rv-chip-count {
            color: #9ca3af;
            font-weight: 400;
        }
        .rv-chip-count-on {
            color: rgba(255,255,255,.85);
            font-weight: 400;
        }
        .rv-clear {
            font-size: 12px;
            color: #DF414F;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 0;
        }
        .rv-clear:hover {
            text-decoration: underline;
        }
        .nrt-scroll-x {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .nrt-scroll-x::-webkit-scrollbar {
            display: none;
        }
        .nrt-scroll-x {
            scrollbar-width: none;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof window.renderNorthlineGridsAll === 'function') window.renderNorthlineGridsAll();
        });
        const chatToggleMobile = document.getElementById('chat-toggle-mobile');
        const chatToggleDekstop = document.getElementById('chat-toggle-dekstop');
        const chatWidget = document.getElementById('chat-widget');
        const chatClose = document.getElementById('chat-close');

        if (chatToggleMobile) {
            chatToggleMobile.onclick = function () {
                if (typeof hideChatNotification === 'function') hideChatNotification();
                if (!chatWidget) return;
                chatWidget.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                chatWidget.classList.add('scale-100', 'opacity-100');
            };
        }

        if (chatToggleDekstop) {
            chatToggleDekstop.onclick = function () {
                if (typeof hideChatNotification === 'function') hideChatNotification();
                if (!chatWidget) return;
                chatWidget.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                chatWidget.classList.add('scale-100', 'opacity-100');
            };
        }

        if (chatClose) {
            chatClose.onclick = function () {
                if (!chatWidget) return;
                chatWidget.classList.remove('scale-100', 'opacity-100');
                chatWidget.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
            };
        }
        function animateButton() {
            chatToggle.animate([
                {
                    transform: 'scale(1) rotate(0deg)'
                },
                {
                    transform: 'scale(.85) rotate(-15deg)'
                },
                {
                    transform: 'scale(1) rotate(0deg)'
                }
            ], {
                duration: 250,
                easing: 'ease-out'
            });
        }
        function showChatNotification() {
            const dot = document.getElementById('chat-notification') || document.getElementById('chat-notification-store');
            if (dot && !chatWidget.classList.contains('scale-100')) {
                dot.classList.remove('hidden');
            }
        }
        function hideChatNotification() {
            const dot = document.getElementById('chat-notification') || document.getElementById('chat-notification-store');
            if (dot) dot.classList.add('hidden');
        }
        const slider = document.getElementById("product-grid-recom") || document.getElementById("product-grid");
        document.getElementById("slide-right").onclick = () => {
            slider.scrollBy({
                left: 200,
                behavior: "smooth"
            });
        };
        document.getElementById("slide-left").onclick = () => {
            slider.scrollBy({
                left: -200,
                behavior: "smooth"
            });
        };
        function showProduk(button) {
            document.getElementById("produk").classList.remove("hidden");
            const kategori = document.getElementById("kategori");
            if (kategori) kategori.classList.add("hidden");
            scrollToSection("produk", button);
        }
        function showKategori(button) {
            document.getElementById("kategori").classList.remove("hidden");
            const produk = document.getElementById("produk");
            if (produk) produk.classList.add("hidden");
            const ulasan = document.getElementById("ulasan");
            if (ulasan) ulasan.classList.add("hidden");
            if (typeof window.renderNorthlineCategoryGrids === 'function') window.renderNorthlineCategoryGrids();
            scrollToSection("kategori", button);
        }
        function showUlasan(button) {
            document.getElementById("ulasan").classList.remove("hidden");
            const produk = document.getElementById("produk");
            if (produk) produk.classList.add("hidden");
            const kategori = document.getElementById("kategori");
            if (kategori) kategori.classList.add("hidden");
            if (typeof window.renderNorthlineReviews === 'function') window.renderNorthlineReviews();
            scrollToSection("ulasan", button);
        }
        function showToko(button) {
            document.getElementById("produk").classList.add("hidden");
            const kategori = document.getElementById("kategori");
            if (kategori) kategori.classList.add("hidden");
            const ulasan = document.getElementById("ulasan");
            if (ulasan) ulasan.classList.add("hidden");
            scrollToSection("toko", button);
        }
    </script>
