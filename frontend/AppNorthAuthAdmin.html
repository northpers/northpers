<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://nl.hostinesia.my.id/public/icons/Favicon.png?v=2" type="image/x-icon">
    <title>Northline - Login Admin</title>
    <link rel="stylesheet" href="/css/tailwind.css?v=0000v1css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{ font-family: 'DM Sans', sans-serif; }
    </style>
</head>
<body class="md:min-h-screen bg-gray-100 font-sans overflow-y-auto overflow-x-hidden">
    <div class="flex flex-col md:flex-row min-h-screen w-full items-center justify-center">

        <div id="carousel-container" class="hidden md:flex w-full md:w-3/5 items-center justify-center md:h-screen relative overflow-hidden transition-colors duration-500 bg-stone-50">
            <div class="w-full h-full relative flex items-center justify-center">
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-8 z-10">
                    <div class="w-full max-w-[340px]">
                        <div class="mb-[10px] mt-[-20px] items-center justify-center hidden md:flex">
                            <a href="/" class="inline-block hover:opacity-70 transition-opacity active:scale-95 transform duration-200">
                                <img src="/public/icons/nrtFaviconWhite.png" alt="Northline Logo" style="height: 120px; object-fit: contain;">
                            </a>
                        </div>
                    </div>
                    <p class="text-[10px] sm:text-xs tracking-widest font-semibold text-zinc-700 uppercase mb-2 px-2.5 py-0.5 rounded-full bg-gray-50">Northline Exclusive</p>
                    <h2 class="text-3xl lg:text-4xl font-extrabold text-black leading-tight tracking-tighter mb-4 max-w-lg drop-shadow-sm">Admin Panel</h2>
                    <a href="/" class="group inline-flex items-center gap-2 text-black text-xs font-bold border-b-2 border-black pb-1 hover:text-zinc-600 hover:border-zinc-600 transition duration-300">
                        Kembali ke Toko
                    </a>
                </div>
            </div>
        </div>

        <div class="w-full md:w-2/5 bg-gray-100 flex items-center justify-center p-2 md:p-10 py-12 md:h-screen order-2">
            <div id="panel-login-classic" class="bg-white p-5 md:w-[400px] shadow-md">
                <div class="flex items-start justify-between mb-8">
                    <div>
                        <h1 class="text-[20px] font-medium text-black leading-none">
                            Log In
                        </h1>
                        <p class="text-[13px] text-gray-500 mt-2">Login sebagai admin panel</p>
                    </div>
                </div>

                <form id="form-login-admin" class="space-y-4">
                    <div class="border border-gray-300 h-[42px] px-4 flex items-center focus-within:border-gray-500 transition-all">
                        <input
                            type="text"
                            id="username"
                            placeholder="Username"
                            required
                            autocomplete="username"
                            class="w-full text-[14px] outline-none text-gray-700 placeholder:text-gray-400 bg-transparent"
                        >
                    </div>
                    <div class="border border-gray-300 h-[42px] px-4 flex items-center justify-between focus-within:border-gray-500 transition-all">
                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                            autocomplete="current-password"
                            class="w-full text-[14px] outline-none text-gray-700 placeholder:text-gray-400 bg-transparent"
                        >
                        <button
                            type="button"
                            id="toggle-password"
                            class="ml-2 opacity-60 hover:opacity-100 transition flex items-center justify-center"
                        >
                            <img
                                id="eye-icon"
                                src="https://img.icons8.com/material-outlined/24/666666/visible--v1.png"
                                class="w-5 h-5 object-contain"
                                loading="lazy">
                        </button>
                    </div>
                    <button
                        type="submit"
                        id="btn-login-admin"
                        class="w-full h-[42px] bg-[#DF414F] hover:bg-[#df414ede] text-white md:text-[14px] text-[13px] font-semibold transition-all">
                        LOG IN
                    </button>
                    <div id="login-error-admin" style="color:#DC2626;margin-top:4px;font-size:12px;display:none;"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        async function checkLoggedIn() {
            try {
                var res = await fetch('/api/auth/me', {
                    credentials: 'same-origin'
                });
                var data = await res.json();
                if (data.success && data.user && data.user.role === 'admin') {
                    window.location.href = '/AppNorthAdmin';
                }
            } catch (e) {}
        }
        checkLoggedIn();

        var eyeOpen = false;
        var toggleBtn = document.getElementById('toggle-password');
        if (toggleBtn) toggleBtn.addEventListener('click', function () {
            var p = document.getElementById('password');
            eyeOpen = !eyeOpen;
            p.type = eyeOpen ? 'text' : 'password';
            var icon = document.getElementById('eye-icon');
            if (icon) icon.src = eyeOpen ? 'https://img.icons8.com/material-outlined/24/666666/invisible--v1.png' : 'https://img.icons8.com/material-outlined/24/666666/visible--v1.png';
        });

        var form = document.getElementById('form-login-admin');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var errorDiv = document.getElementById('login-error-admin');
            errorDiv.textContent = 'Sedang login...';
            errorDiv.style.display = 'block';
            try {
                var res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();
                if (data.success) {
                    errorDiv.textContent = 'Login berhasil, mengalihkan...';
                    window.location.href = '/AppNorthAdmin';
                } else {
                    errorDiv.textContent = data.message || 'Login gagal';
                }
            } catch (err) {
                errorDiv.textContent = 'Error koneksi: ' + err.message;
            }
        });
    </script>
</body>
</html>
