<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://nl.hostinesia.my.id/public/icons/Favicon.png?v=2" type="image/x-icon">
    <title>North Perspective Clothing Official Chat Store</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="/css/tailwind.css?v=0000v1css">
    <link rel="stylesheet" href="/css/style.css?v=0000v1css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .nav-active {color: black !important;}
                @keyframes shine {
            0% {
                left: -150%;
            }
            100% {
                left: 200%;
            }
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        #chat-scroll-container {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #chat-scroll-container::-webkit-scrollbar {
            display: none;
        }
        #chat-messages {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #chat-messages::-webkit-scrollbar {
            display: none;
        }
        .yours {
            background: #dcf8c6;
            color: #111;
            position: relative;
            border-radius: 20px 20px 0px 20px;
            box-shadow: 0 1px 1px rgba(0,0,0,.08),
            0 2px 4px rgba(0,0,0,.06);
        }
        .mine {
            background: #fff;
            color: #111;
            position: relative;
            border-radius: 20px 20px 20px 0px;
            box-shadow: 0 1px 1px rgba(0,0,0,.08),
            0 2px 4px rgba(0,0,0,.06);
        }
        .chat-delete-menu {
            margin-top: 6px;
            animation: slideDown 0.15s ease-out;
        }
        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: .4;
            }
            10% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }
        @keyframes slideDown {
            from { opacity: 0; max-height: 0; margin-top: 0; }
            to { opacity: 1; max-height: 60px; margin-top: 6px; }
        }
        .typing-dot{
            width: 4px;
            height: 4px;
            border-radius: 9999px;
            background: #a3a3a3;
            animation: typingBounce 1s infinite ease-in-out;
        }
        .typing-dot.delay-1{
            animation-delay: .15s;
        }
        .typing-dot.delay-2{
            animation-delay: .3s;
        }
        .typing-text-dots{
            display:inline-flex;
            margin-left:1px;
        }
        .typing-text-dots span{
            width:2px;
            height:2px;
            margin:0 1px;
            border-radius:9999px;
            background:currentColor;
            animation:textTyping 1.2s infinite ease-in-out;
        }
        .typing-text-dots span:nth-child(2){
            animation-delay:.15s;
        }
        .typing-text-dots span:nth-child(3){
            animation-delay:.3s;
        }
        @keyframes textTyping{
            0%, 80%, 100%{
                transform:translateY(0);
                opacity:.4;
            }
            30%{
                transform:translateY(-2px);
                opacity:1;
            }
        }
        .loader-dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loader-dots span {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: #DF414F;
            animation: loaderBounce 1s infinite ease-in-out;
        }
        .loader-dots span:nth-child(2) {
            animation-delay: .15s;
        }
        .loader-dots span:nth-child(3) {
            animation-delay: .3s;
        }
        @keyframes loaderBounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: .5;
            }
            40% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
        @import url('https://fonts.googleapis.com/css2?family=Bruno+Ace&family=Fondamento:ital@0;1&family=Molengo&family=Unbounded:wght@200..900&display=swap');
        .bage-name {
            font-family: 'Bruno Ace', sans-serif !important;
            font-weight: 400 !important;
        }
    </style>
</head>
<body class="bg-gray-100 text-black">

    <div class="fixed inset-0 bg-white flex flex-col">

        <div class="h-[55px] bg-white border-b flex items-center px-3 gap-3">
            <button onclick="window.history.back()">
                <img src="https://img.icons8.com/?size=100&id=20i9yZTsnnmg&format=png&color=DF414F"
                    class="w-6 h-6">
            </button>
            <div class="relative flex-shrink-0">

                <img
                    src="https://nl.hostinesia.my.id/public/icons/nrtFaviconBlack.png"
                    class="w-[40px] h-[40px] border-[1px] rounded-full object-cover">

            </div>
            <div class="flex-1 min-w-0">
                <h2 class="text-[15px] truncate flex items-center">

                <div class="flex items-center gap-1 text-[11px] text-neutral-500">
                    <span id="online-dot" class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>
                    <span id="seller-status">Online</span>
                    <span>|</span>
                    <span class="text-[#DF414F]">
                        10RB+ pembeli kembali
                    </span>
                </div>
            </div>
            <div class="relative group shrink-0">
                <button onclick="toggleChatMenu(event)" class="cursor-pointer p-1 rounded-full hover:bg-neutral-100">
                    <img

                </button>
                <div id="chat-menu"

                        top-full
                        right-0
                        mt-1
                        w-[180px]
                        bg-white
                        border
                        border-gray-200
                        shadow-xl
                        p-2
                        invisible
                        opacity-0
                        translate-y-2
                        group-hover:visible
                        group-hover:opacity-100
                        group-hover:translate-y-0
                        transition-all
                        duration-200
                        z-[9999]
                    ">
                    <div
                        class="
                            absolute
                            -top-1.5
                            right-2
                            w-3
                            h-3
                            bg-white
                            border-l
                            border-t
                            border-gray-200
                            rotate-45
                        ">
                    </div>
                    <button
                        onclick="clearCurrentChat()"
                        class="
                            w-full
                            flex
                            items-center
                            gap-3
                            px-3
                            py-2
                            hover:bg-gray-50
                            rounded-md
                            transition
                        ">
                        <img
                            src="https://img.icons8.com/?size=100&id=nerFBdXcYDve&format=png&color=000000"
                            class="w-5 h-5 opacity-60" loading="lazy">
                        <span class="text-xs text-gray-700">
                            Hapus Chat
                        </span>
                    </button>
                    <button
                        onclick="reportChat()"
                        class="
                            w-full
                            flex
                            items-center
                            gap-3
                            px-3
                            py-2
                            hover:bg-gray-50
                            rounded-md
                            transition
                        ">
                        <img
                            src="https://img.icons8.com/?size=100&id=5342&format=png&color=000000"
                            class="w-5 h-5 opacity-60" loading="lazy">
                        <span class="text-xs text-gray-700">
                            Laporkan Chat
                        </span>
                    </button>
                    <button
                        onclick="showChatInfo()"
                        class="
                            w-full
                            flex
                            items-center
                            gap-3
                            px-3
                            py-2
                            hover:bg-gray-50
                            rounded-md
                            transition
                        ">
                        <img
                            src="https://img.icons8.com/?size=100&id=14093&format=png&color=000000"
                            class="w-5 h-5 opacity-60" loading="lazy">
                        <span class="text-xs text-gray-700">
                            Informasi Chat
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <div id="chat-scroll-container" class="flex-1 overflow-y-auto p-2 space-y-3" style="
            background:
            linear-gradient(
                rgba(255,255,255,.7),
                rgba(255,255,255,.7)
            ), url('https://i.pinimg.com/originals/69/d3/21/69d321443e21f4b57f81532f540a306d.jpg');
            background-size: cover;
            background-position: center;
            opacity: 50;
        ">
            <div class="mine p-3 max-w-[95%]">

                <div id="chat-product-suggestion"></div>
                <div id="quick-replies-bubble"></div>

                <div class="flex items-center justify-between border-t border-neutral-200">
                    <span class="text-[12px] text-neutral-400">
                        Dikirim oleh Northline

                    <span id="current-time" class="text-[10px] text-neutral-400">
                        ....
                    </span>
                </div>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-hidden space-y-3"></div>
                <div id="typing-indicator" class="hidden mb-2">

                        <span class="typing-dot"></span>
                        <span class="typing-dot delay-1"></span>
                        <span class="typing-dot delay-2"></span>
                    </div>
                </div>

        </div>

        <div class="px-3 pb-1 mt-1">
            <div id="quick-replies"

                <button onclick="sendQuickMessage('Bisa bayar di tempat?')"

                <button onclick="sendQuickMessage('Bisa pilih warna?')"

        <div id="chat-image-preview" class="hidden bg-white border-t px-3 pt-2">
            <div class="flex items-start gap-3 rounded-xl bg-neutral-100 p-2">
                <img id="chat-image-preview-img" alt="Preview gambar" class="w-16 h-16 rounded-lg object-cover">
                <div class="flex-1 min-w-0 pt-1">
                    <p class="text-xs font-medium text-neutral-700">Foto siap dikirim</p>
                    <p id="chat-image-preview-name" class="text-[11px] text-neutral-500 truncate"></p>
                    <p class="text-[11px] text-neutral-400 mt-1">Tulis keterangan di kolom pesan di bawah.</p>
                </div>
                <button id="chat-image-remove" type="button" aria-label="Hapus gambar" class="text-neutral-500 text-xl leading-none px-1">&times;</button>
            </div>
        </div>
        <div class="bg-white border-t p-3 flex items-center gap-2">

                type="file"
                id="image-upload"
                accept="image/jpeg,image/png,image/gif,image/webp"

                    src="https://img.icons8.com/?size=100&id=1501&format=png&color=737373"
                    class="w-6 h-6" loading="lazy">
            </button>
            <button onclick="showWishlistProducts()">
                <img src="https://img.icons8.com/?size=100&id=3686&format=png&color=737373"
                    class="w-6 h-6" loading="lazy">
            </button>
            <input
                id="chat-input"
                type="text"
                maxlength="1000"
                placeholder="Tulis Pesan..."
                class="flex-1 h-8 border rounded-full px-4 text-sm outline-none">
            <button id="chat-send-button" onclick="sendMessage()" class="border rounded-full p-1">
                <img
                    src="https://img.icons8.com/?size=100&id=bmqaSU1DN4QP&format=png&color=737373"
                    class="w-6 h-6" loading="lazy">

    <div
        id="wishlist-chat-modal"
        class="hidden fixed inset-0 bg-black/40 z-[9999] flex items-end">

                <h3 class="font-medium text-[15px]">
                    Pilih Produk
                </h3>
            </div>
            <div
                id="wishlist-chat-list"
                class="p-3 rounded-none space-y-2">
            </div>
        </div>
    </div>


    <div id="global-loader"
        class="hidden fixed inset-0 z-[99999] md:hidden flex items-center justify-center bg-white/10 backdrop-blur-lg">
        <div class="loader-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div id="ios-warning-modal"
        class="fixed top-0 left-1/2 -translate-x-1/2 z-[99999]

        <div id="notif-card"

            flex items-center gap-3

            <div class="flex-1 min-w-0 text-white">

                        Northline

                    class="text-[11px] text-gray-500 truncate w-full">

    <script src="/java/AppNorthChatStore.js?v=0000v13shippingcards"></script>
    <script src="/src/services/AppNorthWishlist.js?v=0000v20wl"></script>
    <script src="/java/AppNorthScript.js?v=0000v12sec"></script>
    <script src="/java/AppNorthGlobalLoader.js?v=0000v11sec"></script>
    <script src="/src/services/AppNorthNotification.js?v=0000v11sec"></script>
    <script src="/java/AppNorthCatalog.js?v=0000v58productreport"></script>

    <script>
        function toggleChatMenu(e) {
            e.stopPropagation();
            const menu =
                document.getElementById(
                    "chat-menu"
                );
            menu.classList.toggle(
                "hidden"
            );
        }
        document.addEventListener(
            "click",
            () => {
                document
                    .getElementById(
                        "chat-menu"
                    )
                    ?.classList.add(
                        "hidden"
                    );
            }
        );
        document
        .getElementById(
            "chat-menu"
        )
        ?.addEventListener(
            "click",
            (e) => {
                e.stopPropagation();
            }
        );
    </script>
    
</body>
</html>
