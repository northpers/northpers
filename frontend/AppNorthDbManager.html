<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://nl.hostinesia.my.id/public/icons/Favicon.png?v=2" type="image/x-icon">
    <title>MySQL Manager | Northline Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{font-family:'DM Sans',sans-serif;margin:0;padding:0;box-sizing:border-box}
        body{background:#f3f4f6;color:#111;overflow:hidden}
        ::-webkit-scrollbar{width:7px;height:7px}
        ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}
        ::-webkit-scrollbar-track{background:#f9fafb}
        .mm-wrap{display:flex;height:100vh}
        .mm-side{width:280px;min-width:280px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;box-shadow:0 0 0 1px #e5e7eb}
        .mm-side-head{padding:14px 16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px}
        .mm-side-head .logo{height:28px}
        .mm-side-head .t{font-size:15px;font-weight:700;color:#111}
        .mm-conn{margin:12px;background:#f3f4f6;border:1px solid #e5e7eb;padding:12px;border-radius:8px}
        .mm-conn h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#6b7280;margin-bottom:8px}
        .mm-conn input,.mm-conn select{width:100%;height:34px;border:1px solid #d1d5db;background:#fff;color:#111;padding:0 10px;font-size:12px;margin-bottom:8px;outline:none;border-radius:6px}
        .mm-conn input:focus,.mm-conn select:focus{border-color:#DF414F;box-shadow:0 0 0 3px rgba(223,65,79,.15)}
        .mm-tree{flex:1;overflow-y:auto;padding:0 8px 12px}
        .mm-tree-search{width:100%;height:32px;border:1px solid #e5e7eb;background:#f3f4f6;color:#111;padding:0 10px;font-size:12px;margin:8px 0;outline:none;border-radius:6px}
        .mm-tree-search:focus{border-color:#DF414F;box-shadow:0 0 0 3px rgba(223,65,79,.15)}
        .mm-node{user-select:none}
        .mm-node-row{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12.5px;cursor:pointer;border-radius:6px;color:#4b5563;transition:background .15s}
        .mm-node-row:hover{background:#f9fafb}
        .mm-node-row.active{background:#fdecee;color:#DF414F;font-weight:600}
        .mm-node-row .caret{width:14px;text-align:center;color:#9ca3af;flex-shrink:0;transition:transform .15s}
        .mm-node-row .ico{width:15px;flex-shrink:0;text-align:center}
        .mm-children{margin-left:14px;border-left:1px solid #e5e7eb;padding-left:4px}
        .mm-loading{color:#9ca3af;font-size:12px;padding:8px}
        .mm-main{flex:1;display:flex;flex-direction:column;min-width:0}
        .mm-topbar{height:52px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
        .mm-topbar .crumb{font-size:13px;color:#6b7280;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .mm-topbar .crumb b{color:#111}
        .mm-status{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7280}
        .mm-dot{width:8px;height:8px;border-radius:50%;background:#ef4444}
        .mm-dot.on{background:#22c55e}
        .mm-tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 16px}
        .mm-tab{padding:10px 18px;font-size:12.5px;font-weight:600;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
        .mm-tab:hover{color:#111;background:#f3f4f6}
        .mm-tab.active{color:#DF414F;border-bottom-color:#DF414F;background:#fff}
        .mm-tab:disabled{opacity:.35;cursor:not-allowed}
        .mm-content{flex:1;overflow:auto;padding:20px;background:#f3f4f6}
        .mm-btn{padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#4b5563;transition:all .15s;border-radius:6px}
        .mm-btn:hover{background:#f3f4f6;border-color:#DF414F;color:#DF414F}
        .mm-btn.primary{background:#DF414F;border-color:#DF414F;color:#fff}
        .mm-btn.primary:hover{background:#c93643;border-color:#c93643;color:#fff}
        .mm-btn.danger{background:#ef4444;border-color:#ef4444;color:#fff}
        .mm-btn.danger:hover{background:#dc2626;border-color:#dc2626;color:#fff}
        .mm-btn.sm{padding:4px 10px;font-size:11px}
        .mm-card{background:#fff;border:1px solid #e5e7eb;padding:16px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
        .mm-grid{border-collapse:collapse;width:100%;font-size:12px}
        .mm-grid th{background:#f3f4f6;color:#6b7280;text-align:left;padding:9px 10px;font-weight:600;border-bottom:1px solid #e5e7eb;white-space:nowrap;position:sticky;top:0;z-index:1}
        .mm-grid td{padding:8px 10px;border-bottom:1px solid #f9fafb;color:#4b5563;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .mm-grid tr:nth-child(even) td{background:#f9fafb}
        .mm-grid tr:hover td{background:#f9fafb}
        .mm-grid .null{color:#9ca3af;font-style:italic}
        .mm-sql{width:100%;min-height:160px;border:1px solid #d1d5db;background:#fff;color:#111;padding:12px;font-family:'Consolas',monospace;font-size:13px;resize:vertical;outline:none;border-radius:6px}
        .mm-sql:focus{border-color:#DF414F;box-shadow:0 0 0 3px rgba(223,65,79,.15)}
        .mm-badge{display:inline-block;padding:2px 8px;font-size:10.5px;font-weight:600;border-radius:3px}
        .mm-badge.ok{background:#dcfce7;color:#166534}
        .mm-badge.warn{background:#fef3c7;color:#92400e}
        .mm-badge.err{background:#fee2e2;color:#991b1b}
        .mm-badge.info{background:#dbeafe;color:#1e40af}
        .mm-msg{padding:10px 12px;font-size:12px;border-radius:6px;margin-bottom:12px}
        .mm-msg.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
        .mm-msg.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
        .mm-msg.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
        .mm-pager{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px;color:#6b7280}
        .mm-pager button{padding:5px 12px;font-size:11px;border:1px solid #d1d5db;background:#fff;color:#4b5563;cursor:pointer;border-radius:4px}
        .mm-pager button:disabled{opacity:.4;cursor:not-allowed}
        .mm-pager button:hover:not(:disabled){border-color:#DF414F;color:#DF414F}
        .mm-modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
        .mm-modal.show{display:flex}
        .mm-modal-box{background:#fff;border:1px solid #e5e7eb;width:100%;max-width:620px;max-height:85vh;overflow:auto;padding:20px;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.15)}
        .mm-modal-box h3{font-size:15px;font-weight:700;color:#111;margin-bottom:14px}
        .mm-field{margin-bottom:10px}
        .mm-field label{display:block;font-size:11px;color:#6b7280;margin-bottom:4px}
        .mm-field input,.mm-field select,.mm-field textarea{width:100%;height:36px;border:1px solid #d1d5db;background:#fff;color:#111;padding:0 10px;font-size:12px;outline:none;border-radius:6px}
        .mm-field input:focus,.mm-field select:focus,.mm-field textarea:focus{border-color:#DF414F;box-shadow:0 0 0 3px rgba(223,65,79,.15)}
        .mm-field textarea{height:90px;padding:8px 10px;font-family:'Consolas',monospace;resize:vertical}
        .mm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        @media(max-width:820px){
            .mm-side{width:100%;position:absolute;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.15)}
            .mm-main{margin-left:0}
            .mm-grid2{grid-template-columns:1fr}
        }
        .mm-sec-title{font-size:12px;font-weight:700;color:#111;border-bottom:2px solid #DF414F;display:inline-block;padding-bottom:3px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
    </style>
</head>
<body>
<div class="mm-wrap">
    <div class="mm-side">
        <div class="mm-side-head">
            <img class="logo" src="https://nl.hostinesia.my.id/public/icons/nrtFaviconBlack.png">
            <span class="t">MySQL Manager</span>
        </div>
        <input class="mm-tree-search" id="mm-tree-search" placeholder="Cari tabel..." oninput="mmFilterTree()">
        <div class="mm-tree" id="mm-tree"><div class="mm-loading">Memuat database...</div></div>
    </div>
    <div class="mm-main">
        <div class="mm-topbar">
            <div class="mm-topbar crumb" id="mm-crumb"><span style="color:#9ca3af">Silakan hubungkan ke server MySQL.</span></div>
            <div class="mm-status"><span class="mm-dot" id="mm-dot"></span><span id="mm-conn-label">Disconnected</span></div>
        </div>
        <div class="mm-tabs" id="mm-tabs" style="display:none">
            <div class="mm-tab active" data-tab="overview" onclick="mmSetTab('overview')">Overview</div>
            <div class="mm-tab" data-tab="structure" onclick="mmSetTab('structure')">Struktur</div>
            <div class="mm-tab" data-tab="data" onclick="mmSetTab('data')">Data</div>
            <div class="mm-tab" data-tab="views" onclick="mmSetTab('views')">Views</div>
            <div class="mm-tab" data-tab="routines" onclick="mmSetTab('routines')">Routines</div>
            <div class="mm-tab" data-tab="triggers" onclick="mmSetTab('triggers')">Triggers</div>
            <div class="mm-tab" data-tab="events" onclick="mmSetTab('events')">Events</div>
            <div class="mm-tab" data-tab="users" onclick="mmSetTab('users')">Users</div>
            <div class="mm-tab" data-tab="stats" onclick="mmSetTab('stats')">Statistik</div>
            <div class="mm-tab" data-tab="processes" onclick="mmSetTab('processes')">Proses</div>
            <div class="mm-tab" data-tab="search" onclick="mmSetTab('search')">Cari</div>
            <div class="mm-tab" data-tab="sql" onclick="mmSetTab('sql')">SQL Console</div>
            <div class="mm-tab" data-tab="operations" onclick="mmSetTab('operations')">Operasi</div>
            <div class="mm-tab" data-tab="server" onclick="mmSetTab('server')">Server</div>
        </div>
        <div class="mm-content" id="mm-content">
            <div style="text-align:center;padding:80px 0;color:#9ca3af;font-size:14px">
                <div style="font-size:40px;margin-bottom:10px"></div>
                MySQL Database Manager<br><span style="font-size:12px">Hubungkan ke server untuk mulai mengelola database.</span>
            </div>
        </div>
    </div>
</div>
<div class="mm-modal" id="mm-modal" onclick="if(event.target===this)mmCloseModal()">
    <div class="mm-modal-box" id="mm-modal-body"></div>
</div>
<script src="/java/AppNorthDbManager.js?v=0000v13dbmgr"></script>
</body>
</html>
