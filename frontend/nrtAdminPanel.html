<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://nl.hostinesia.my.id/public/icons/Favicon.png" type="image/x-icon">
    <title>Northline Admin Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .nav-active {color: black !important;}
                @keyframes shine {
            0% {
                left: -150%;
            }
            100% {
                left: 200%;
            }
        }
        .chat-user {
            position: relative;
            background: #dcf8c6;
            border-radius: 12px 12px 0px 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,.08);
        }
        .chat-admin {
            position: relative;
            background: #fff;
            border-radius: 12px 12px 12px 0px;
            box-shadow: 0 1px 2px rgba(0,0,0,.08);
        }
        .loader-dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loader-dots span {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: #DF414F;
            animation: loaderBounce 1s infinite ease-in-out;
        }
        .loader-dots span:nth-child(2) {
            animation-delay: .15s;
        }
        .loader-dots span:nth-child(3) {
            animation-delay: .3s;
        }
        @keyframes loaderBounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: .5;
            }
            40% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-black">

    <div class="h-screen bg-[#f6f6f6] flex overflow-hidden">

        <div class="w-[320px] bg-white border-r border-neutral-200 flex flex-col">

            <div class="h-[60px] px-4 flex items-center border-b">
                <h2 class="text-[22px] text-[#DF414F] font-semibold">
                    Chat
                    <span class="text-[14px]" id="total-chat-count">(0)</span>
                </h2>
            </div>

            <div class="p-3 border-b">
                <input
                    type="text"
                    placeholder="Cari nama"
                    class="w-full h-10 border border-neutral-200 px-3 text-sm outline-none">
            </div>

            <div
                id="chat-user-list"
                class="flex-1 overflow-y-auto">


                <div
                    class="flex items-center gap-3 px-3 py-3 border-b hover:bg-neutral-50 cursor-pointer">

                    <img
                        src="https://img.icons8.com/?size=100&id=kvqTlMRogUYm&format=png&color=737373"
                        class="w-11 h-11">

                    <div class="flex-1 min-w-0">

                        <div class="flex justify-between">

                            <h3 class="text-[14px] truncate">
                                Load Username...
                            </h3>

                            <span class="text-[11px] text-neutral-400">
                                Load Time...
                            </span>

                        </div>

                        <p class="text-[12px] text-neutral-500 truncate">
                            ...
                        </p>

                    </div>

                    <div
                        class="w-5 h-5 rounded-full bg-[#DF414F] text-white text-[10px] flex items-center justify-center">
                        ...
                    </div>

                </div>

            </div>

        </div>

        <div class="flex-1 flex flex-col bg-[#f5f5f5]">


            <div
                class="h-[60px] bg-white border-b border-neutral-200 px-5 flex items-center justify-between">

                <div class="flex items-center gap-3">

                    <img
                        src="https://img.icons8.com/?size=100&id=kvqTlMRogUYm&format=png&color=737373"
                        class="w-10 h-10">

                    <div>

                        <h3
                            id="current-user-name"
                            class="text-[15px]">
                            Pilih Chat
                        </h3>

                        <p
                            class="text-[11px] text-green-500">
                            Online
                        </p>

                    </div>

                </div>

            </div>


            <div
                id="admin-chat-messages"
                class="flex-1 overflow-y-auto p-5 space-y-3">

                <div class="flex justify-center">

                    <span
                        class="bg-white border px-4 py-1 rounded-full text-[12px] text-neutral-500">
                        18 Juni
                    </span>

                </div>

            </div>


            <div
                id="typing-indicator"
                class="hidden px-5 pb-2">

                <div
                    class="inline-flex bg-white border px-3 py-2 rounded-lg gap-1">

                    <span class="w-2 h-2 bg-neutral-400 rounded-full animate-bounce"></span>
                    <span class="w-2 h-2 bg-neutral-400 rounded-full animate-bounce"></span>
                    <span class="w-2 h-2 bg-neutral-400 rounded-full animate-bounce"></span>

                </div>

            </div>


            <div
                class="bg-white border-t border-neutral-200 p-3">

                <div class="flex items-center gap-2">

                    <button>
                        <img
                            src="https://img.icons8.com/?size=100&id=1501&format=png&color=737373"
                            class="w-5 h-5">
                    </button>

                    <button>
                        <img
                            src="https://img.icons8.com/?size=100&id=3686&format=png&color=737373"
                            class="w-5 h-5" loading="lazy">
                    </button>

                    <input
                        id="admin-message"
                        type="text"
                        placeholder="Tulis pesan"
                        class="flex-1 h-9 border border-neutral-200 rounded-full px-4 text-sm outline-none">

                    <button
                        onclick="sendAdminMessage()">

                        <img
                            src="https://img.icons8.com/?size=100&id=26192&format=png&color=737373"
                            class="w-6 h-6" loading="lazy">

                    </button>

                </div>

            </div>

        </div>

    </div>

    <div
        id="modal-search-result"
        class="hidden absolute top-full left-0 right-0 bg-white border border-gray-200 shadow-lg z-[9999] max-h-72 overflow-y-auto">
    </div>

    <div id="ios-warning-modal"
        class="fixed top-0 left-1/2 -translate-x-1/2 z-[9999]
        translate-y-[-120%] opacity-0
        transition-all duration-500 ease-out">

        <div id="notif-card"
            class="w-[346px] mt-3 px-4 py-3
            bg-white backdrop-blur-md shadow-xl
            flex items-center gap-3
            cursor-grab active:cursor-grabbing">
            <img 
                src="https://nl.hostinesia.my.id/public/icons/Favicon.png"
                class="w-8 h-8" loading="lazy">
            <div class="flex-1 min-w-0 text-white">
                <div class="flex justify-between items-center">
                    <h3 id="ios-modal-title"
                        class="text-[13px] text-black">
                        Northline
                    </h3>
                    <span id="notif-time"
                        class="text-[11px] text-gray-300 cursor-pointer flex items-center gap-1">
                        Just now 
                        <img id="arrow"
                            src="https://img.icons8.com/?size=100&id=40021&format=png&color=000000"
                            class="w-2 h-2 transition-transform duration-200" loading="lazy">
                    </span>
                </div>
                <p id="ios-modal-message"
                    class="text-[11px] text-gray-500 truncate w-full">
                    Message...
                </p>
            </div>

        </div>
    </div>

    <div id="global-loader"
        class="hidden fixed inset-0 z-[99999] md:hidden flex items-center justify-center bg-white/10 backdrop-blur-lg">
        <div class="loader-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="java/nrtAdminPanel.js"></script>
    <script src="/src/services/storage-config.js?v=27072026"></script>
    <script src="/java/script.js?v=27072026"></script>
    <script src="/java/global_loader.js?v=27072026"></script>
    <script src="/src/services/global_notif.js?v=27072026"></script>

</body>
</html>
